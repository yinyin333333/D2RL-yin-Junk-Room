[regression]
enabled = true

# 지정 NPC에게 "회귀" 대화가 나타날 최소 캐릭터 레벨입니다.
required_level = 99

# normal, nightmare, hell, any를 사용할 수 있습니다.
allowed_difficulties = ["hell"]

# 한 번의 회귀에서 뽑는 보상 행 수입니다.
reward_count_min = 1
reward_count_max = 1
allow_duplicate_rolls = false

# 대상 NPC의 숫자 MonStats ID입니다. 기본값 176은 Atma입니다. 메뉴 문자열은 자체 MPQ의 regression 네임스페이스에서 조회합니다.
npc_class_id = 176


# true이면 경험치·레벨·미사용 포인트 같은 진행 제어 스탯도 허용합니다.
# 세이브를 망가뜨릴 수 있으므로 기본값은 false입니다.
allow_unsafe_stats = false

# stat_id는 현재 모드의 ItemStatCost/CASC 데이터에 존재해야 합니다.
# value_shift=8은 생명력/마나처럼 8비트 고정소수점인 스탯에 사용합니다.

# 아래 보상은 모두 활성화되어 가중치 추첨에 참여합니다. 기존 행의 수치/가중치는 유지합니다.
# 신규 행의 1은 밸런스 권장값이 아니라 최소 양의 원시 스탯 단위입니다.
# TXT 정의에 근거한 수치 보상 목록이며 각 효과의 실제 게임 동작을 모두 검증한 것은 아닙니다.
# 회귀는 stat_id/layer별 단순 합산입니다. 상한이 있는 속성은 누적해도 효과가 더 늘지 않을 수 있습니다.
# 개별 최소/최대 피해와 지속시간은 한 묶음으로 지급되지 않습니다. 필요한 관련 값은 따로 설정하세요.
# 제외된 전체 행과 사유: reward-stat-audit.json

